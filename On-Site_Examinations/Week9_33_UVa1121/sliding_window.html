<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>滑動窗口模擬器 (UVa 1121)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .array-row { display: flex; gap: 8px; margin-top: 20px; margin-bottom: 5px;}
        .box { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; border: 2px solid #bbb; border-radius: 8px; transition: all 0.3s ease; }
        .active { background-color: #d4edda; border-color: #28a745; color: #155724; }
        .pointers { display: flex; gap: 8px; font-size: 14px; font-weight: bold; color: #555; height: 20px;}
        .pointer-box { width: 50px; text-align: center; }
        .info-panel { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px solid #ddd; }
        button { padding: 10px 15px; font-size: 16px; margin-right: 10px; cursor: pointer; border: none; border-radius: 5px; background-color: #007bff; color: white; transition: 0.2s;}
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        button:hover:not(:disabled) { background-color: #0056b3; }
        .btn-shrink { background-color: #dc3545; }
        .btn-shrink:hover:not(:disabled) { background-color: #c82333; }
    </style>
</head>
<body>

    <h2>滑動窗口模擬器 (目標總和 S = 15)</h2>
    
    <div>
        <button id="btn-expand" onclick="expandRight()">👉 右界擴張 (吃數字)</button>
        <button id="btn-shrink" class="btn-shrink" onclick="shrinkLeft()" disabled>👈 左界收縮 (吐數字)</button>
        <button onclick="reset()" style="background-color: #6c757d;">🔄 重置</button>
    </div>

    <div class="array-row" id="array-container"></div>
    <div class="pointers" id="pointers-container"></div>

    <div class="info-panel">
        <p>當前區間：<span id="window-range">[0, -1]</span></p>
        <p>當前總和：<strong id="current-sum" style="font-size: 24px; color: #d9534f;">0</strong></p>
        <p>目前最短合法長度：<strong id="min-len" style="font-size: 24px; color: #0275d8;">無 (大於等於 15 才會記錄)</strong></p>
        <p>💡 提示：<span id="hint" style="color: #666; font-weight: bold;">請點擊「右界擴張」開始吃數字！</span></p>
    </div>

    <script>
        // 這裡就是陣列資料，你可以隨時手動修改這裡來測試不同測資！
        const arr = [5, 1, 3, 5, 10, 7, 4, 9, 2, 8];
        const targetS = 15;
        
        // 雙指標與狀態變數
        let left = 0;
        let right = -1;
        let currentSum = 0;
        let minLength = Infinity;

        // 畫面渲染邏輯
        function render() {
            const arrContainer = document.getElementById('array-container');
            const ptrContainer = document.getElementById('pointers-container');
            arrContainer.innerHTML = '';
            ptrContainer.innerHTML = '';

            arr.forEach((num, index) => {
                const box = document.createElement('div');
                box.className = 'box';
                // 判斷格子是否在合法區間內
                if (index >= left && index <= right) box.classList.add('active');
                box.innerText = num;
                arrContainer.appendChild(box);

                const pBox = document.createElement('div');
                pBox.className = 'pointer-box';
                let ptrText = '';
                if (index === left && index === right) ptrText = 'L / R';
                else if (index === left) ptrText = 'L ↑';
                else if (index === right) ptrText = 'R ↑';
                pBox.innerText = ptrText;
                ptrContainer.appendChild(pBox);
            });

            document.getElementById('current-sum').innerText = currentSum;
            document.getElementById('window-range').innerText = `[${left}, ${right < left ? '無' : right}]`;
            document.getElementById('min-len').innerText = minLength === Infinity ? '無' : minLength;

            const btnExpand = document.getElementById('btn-expand');
            const btnShrink = document.getElementById('btn-shrink');
            const hint = document.getElementById('hint');

            if (currentSum < targetS) {
                btnExpand.disabled = right >= arr.length - 1;
                btnShrink.disabled = true;
                document.getElementById('current-sum').style.color = '#d9534f';
                hint.innerText = "總和不夠，請繼續向右擴張吃數字。";
            } else {
                btnExpand.disabled = true;
                btnShrink.disabled = left > right;
                document.getElementById('current-sum').style.color = '#28a745';
                hint.innerText = "總和達標！立刻結算長度，並縮小左界看能不能更短。";
            }
        }

        // 右指標擴張 (等同於 for 迴圈裡的 sum += vec[i])
        function expandRight() {
            if (right < arr.length - 1) {
                right++;
                currentSum += arr[right];
                if (currentSum >= targetS) {
                    minLength = Math.min(minLength, right - left + 1);
                }
                render();
            }
        }

        // 左指標收縮 (等同於 while 迴圈裡的 sum -= vec[k++])
        function shrinkLeft() {
            if (left <= right) {
                currentSum -= arr[left];
                left++;
                if (currentSum >= targetS) {
                     minLength = Math.min(minLength, right - left + 1);
                }
                render();
            }
        }

        function reset() {
            left = 0;
            right = -1;
            currentSum = 0;
            minLength = Infinity;
            render();
        }

        // 初始化畫面
        render();
    </script>
</body>
</html>
